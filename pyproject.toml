[project]
name = "jpreader-tools"
version = "0.1.0"
description = "Build tools for the Ultra Moon Japanese reader patch"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11",
    "sudachidict-core>=20260723.1",
    "sudachipy>=0.7.0",
]

[project.scripts]
jpreader = "jpreader_tools.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/jpreader_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "rom: needs the Ultra Moon ROM (JPREADER_ROM in .env)",
    "e2e: drives the Azahar emulator",
]
addopts = "-m 'not e2e'"
